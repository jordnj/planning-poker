spring:
  application:
    name: planning-poker
  datasource:
    url: jdbc:h2:mem:planningpoker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    # never echo statements or bound parameters: parameters carry decrypted
    # session names, vote values and ciphertext blobs
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  tomcat:
    accesslog:
      # request paths embed the session code, which is the capability to join a
      # session — keep them out of access logs entirely
      enabled: false

logging:
  level:
    # belt and braces against SQL/parameter logging being switched on elsewhere
    org.hibernate.SQL: "off"
    org.hibernate.orm.jdbc.bind: "off"
    org.hibernate.type.descriptor.sql: "off"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Override in production via APP_JWT_SECRET (>= 32 bytes)
  jwt-secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  # Base64 of exactly 32 random bytes, from a secret manager in production.
  # Rotating this makes existing encrypted columns unreadable — re-encrypt first.
  # The dev default exists only so `bootRun` works out of the box.
  data-key: ${APP_DATA_KEY:ZGV2LW9ubHktZGF0YS1rZXktZG8tbm90LXVzZSEhISE=}
  # Base URL used to build shareable join links; falls back to request origin when empty
  base-url: ${APP_BASE_URL:}
  session:
    idle-timeout: ${APP_SESSION_IDLE_TIMEOUT:PT4H}
    cleanup-interval-ms: 300000
  token:
    participant-ttl: PT12H
    user-ttl: PT12H
  rate-limit:
    session-create-per-minute: 20
    join-per-minute: 60

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planningpoker}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:planningpoker}
    password: ${DB_PASSWORD:}
